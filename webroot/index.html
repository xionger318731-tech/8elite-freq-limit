<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>8elite限频</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
  --fg:#e6e9ef; --dim:#8b93a3; --accent:#4d9fff; --good:#3ecf8e;
  --warn:#f5a623; --bad:#ff5c5c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px 14px 40px;background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
h1{font-size:19px;margin:0 0 4px;font-weight:600}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:500;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0}
.row+.row{border-top:1px solid var(--line)}
.k{color:var(--dim);font-size:13px}
.v{font-variant-numeric:tabular-nums;font-weight:500;transition:color .25s ease}
.v.good{color:var(--good)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}
.seg{display:flex;gap:6px;margin-top:4px}
.seg button{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--fg);font-size:13px;font-weight:500;transition:.15s}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button:active{transform:scale(.97)}
.btn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--fg);font-size:14px;margin-top:8px;
  transition:transform .12s ease, background .2s ease, opacity .2s ease}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.btn.loading{opacity:.55;pointer-events:none}
.btn.loading::after{content:'';display:inline-block;width:12px;height:12px;
  margin-left:8px;vertical-align:-1px;border:2px solid currentColor;
  border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.6}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:500;transition:background .25s ease,color .25s ease}
.badge.idle{background:rgba(62,207,142,.15);color:var(--good)}
.badge.boost{background:rgba(245,166,35,.15);color:var(--warn)}
.badge.rich{background:rgba(77,159,255,.15);color:var(--accent)}
.badge.hold{background:rgba(139,147,163,.15);color:var(--dim)}
.badge.off,.badge.disabled{background:rgba(139,147,163,.15);color:var(--dim)}
.badge.panic{background:rgba(255,92,92,.15);color:var(--bad)}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  background:rgba(40,44,54,.96);border:1px solid var(--line);padding:10px 18px;
  border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;
  z-index:99;max-width:88vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>

<h1>8elite限频</h1>
<div class="sub">V1.4fix · 空闲真落 748M · 重载直上 3.53G</div>

<div class="card">
  <h2>实时状态</h2>
  <div class="row"><span class="k">服务</span><span class="v" id="svc">—</span></div>
  <div class="row"><span class="k">状态</span><span id="scene">—</span></div>
  <div class="row"><span class="k">前台</span><span class="v" id="fg">—</span></div>
  <div class="row"><span class="k">需求频率</span><span class="v" id="needBig">—</span></div>
  <div class="row"><span class="k">大核天花板</span><span class="v" id="capBig">—</span></div>
  <div class="row"><span class="k">超大核天花板</span><span class="v" id="capPrime">—</span></div>
  <div class="row"><span class="k">撞顶率</span><span class="v" id="sat">—</span></div>
  <div class="row"><span class="k">温度</span><span class="v" id="temp">—</span></div>
  <div class="row"><span class="k">整机功耗</span><span class="v" id="power">—</span></div>
  <div class="row"><span class="k">目标占用</span><span class="v" id="target">—</span></div>
</div>

<div class="card">
  <h2>压制风格</h2>
  <div class="seg">
    <button id="btnEco" onclick="setStyle('eco')">省电</button>
    <button id="btnBalance" onclick="setStyle('balance')">均衡</button>
    <button id="btnPerf" onclick="setStyle('perf')">流畅</button>
  </div>
  <div class="hint">
    <b>省电</b>：目标占用基准 -5%，更激进限频（最省电）<br>
    <b>均衡</b>：基准不变，折中<br>
    <b>流畅</b>：目标占用基准 +20%，更宽松（少限频）
  </div>
</div>

<div class="card">
  <h2>开关</h2>
  <div class="seg">
    <button id="btnAuto" onclick="setMode('auto')">启用</button>
    <button id="btnOff" onclick="setMode('learn')">关闭</button>
  </div>
  <div class="hint">关闭后完全不干预，等同没装</div>
</div>

<div class="card">
  <h2>操作</h2>
  <button class="btn" onclick="act('restart')">重启服务</button>
  <button class="btn" onclick="act('release')">立即归还全部限制</button>
  <button class="btn" id="btnRefresh" onclick="refresh()">刷新</button>
</div>

<div id="toast"></div>

<script>
/* KernelSU 的 ksu.exec 第三个参数必须是「全局函数名（字符串）」，传函数会导致
   永远不回调、页面一直转圈（这是本项目 docs/NOTES.md 第四节记录过的坑）。
   这里只走字符串回调，并对 options 做兼容：优先传对象，失败再传 JSON 字符串。 */
function ksuExec(command, timeoutMs){
  return new Promise(resolve=>{
    if(typeof ksu==='undefined' || !ksu || typeof ksu.exec!=='function'){
      resolve({errno:-1,stdout:'',stderr:'no-bridge'}); return;
    }
    const id='__ksucb_'+Math.random().toString(36).slice(2);
    let done=false;
    const to=setTimeout(()=>{
      if(!done){done=true; try{delete window[id];}catch(e){window[id]=undefined;}
        resolve({errno:-1,stdout:'',stderr:'timeout'});}
    }, timeoutMs||12000);
    window[id]=function(errno,stdout,stderr){
      if(done) return;
      done=true; clearTimeout(to);
      try{delete window[id];}catch(e){window[id]=undefined;}
      resolve({errno:(errno===null||errno===undefined)?0:errno,
               stdout:stdout||'', stderr:stderr||''});
    };
    try{
      ksu.exec(command, {cwd:'/'}, id);
    }catch(e1){
      try{ ksu.exec(command, JSON.stringify({cwd:'/'}), id); }
      catch(e2){
        if(!done){done=true; clearTimeout(to); resolve({errno:-1,stdout:'',stderr:String(e2)});}
      }
    }
  });
}

const STATE='/data/adb/eta_sched/state';
const STATE_FB='/storage/emulated/0/Android/8elite/obs/state';
const CFG='/storage/emulated/0/Android/8elite/config.conf';
const SCRIPT='/data/adb/eta_sched/ctl.sh';
let busy=false;
let lastTick=-1, lastTickAt=0;
const rb=document.getElementById('btnRefresh');

function toast(m,ms){
  const el=document.getElementById('toast');
  el.textContent=m; el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'), ms||1800);
}
function fmt(v){
  const n=parseInt(v,10);
  if(!n||isNaN(n)||n<=0) return '不压';
  return (n/1000000).toFixed(2)+'G';
}

const SCENE_MAP={
  init:['初始化','hold'],
  disabled:['已关闭','disabled'],
  off:['熄屏·交还官方','off'],
  boot:['开机保护','hold'],
  charging:['充电·放开','off'],
  panic:['过热·让路','hot'],
  rich_wait:['升档待确认','boost'],
  boost:['需求逼近·升档','boost'],
  hold:['跟随中','hold'],
  save:['富余·降档省电','rich'],
  idle:['空闲·已落748M','idle'],
  rich:['需求富余','rich']
};

async function refresh(){
  if(busy){ toast('刷新中…'); return; }
  busy=true;
  if(rb){ rb.classList.add('loading'); rb.textContent='刷新中'; }
  try{
    let r=await ksuExec(`cat ${STATE} 2>/dev/null`, 8000);
    if(!r.stdout || !r.stdout.trim()){
      // 主路径（root 私有）读不到，退回 emulated 镜像
      r=await ksuExec(`cat ${STATE_FB} 2>/dev/null`, 8000);
    }
    if(!r.stdout || !r.stdout.trim()){
      /* 读不到 state ≠ 服务没跑：可能是 ksu 桥断了 / 权限 / 冻结。
         用 ctl.sh status 做二次确认，只有确认「未运行」才报未运行。 */
      let diag='';
      if(r.stderr==='no-bridge'){
        diag='无法调用 root（WebUI 未在 KernelSU 内打开）';
      }else{
        const st=await ksuExec(`sh ${SCRIPT} status 2>&1 | grep -m1 守护进程`, 10000);
        diag=(st.stdout||'').trim();
      }
      const svc=document.getElementById('svc');
      if(/运行中/.test(diag)){ svc.textContent='运行中（状态读取失败）'; svc.className='v warn'; }
      else { svc.textContent='未运行'; svc.className='v bad'; }
      document.getElementById('scene').innerHTML='—';
      toast(diag?('状态：'+diag.slice(0,40)):'读取状态失败');
      busy=false; return;
    }
    const kv={};
    for(const ln of r.stdout.split('\n')){
      const i=ln.indexOf('=');
      if(i>0) kv[ln.slice(0,i).trim()]=ln.slice(i+1).trim();
    }
    /* 存活判定不能只看 alive=1：daemon 被杀后 state 文件会留在磁盘上，
       这里用 tick 是否还在推进来判定“真活着”，避免误报运行中。 */
    const svc=document.getElementById('svc');
    const tk=parseInt(kv.tick||'-1',10);
    const nowMs=Date.now();
    if(tk>=0 && tk!==lastTick){ lastTick=tk; lastTickAt=nowMs; }
    const stalled = (lastTick>=0 && lastTickAt>0 && (nowMs-lastTickAt)>20000);
    if(kv.alive==='1' && !stalled){
      svc.textContent='运行中'; svc.className='v good';
    }else if(stalled){
      svc.textContent='状态停滞'; svc.className='v bad';
    }else{
      svc.textContent='已停止'; svc.className='v bad';
    }

    const sc=SCENE_MAP[kv.scene]||[kv.scene||'—','hold'];
    document.getElementById('scene').innerHTML='<span class="badge '+sc[1]+'">'+sc[0]+'</span>';

    document.getElementById('fg').textContent=kv.fg||'—';
    document.getElementById('needBig').textContent=fmt(kv.need_big);
    document.getElementById('capBig').textContent=fmt(kv.cap_big);
    document.getElementById('capPrime').textContent=fmt(kv.cap_prime);

    const sat=parseInt(kv.sat_big||0,10);
    const satEl=document.getElementById('sat');
    satEl.textContent=(sat/10).toFixed(1)+'%';
    satEl.className='v '+(sat>=300?'bad':(sat<60?'good':''));

    document.getElementById('temp').textContent=kv.temp?((kv.temp/1000).toFixed(1)+'°C'):'—';

    const pwr=parseInt(kv.power||0,10);
    document.getElementById('power').textContent=pwr?pwr+' mW':'—';

    const tgt=parseInt(kv.target||0,10);
    document.getElementById('target').textContent=tgt?tgt+'%':'—';

    // 开关
    const m=kv.mode||'auto';
    document.getElementById('btnAuto').classList.toggle('on', m==='auto');
    document.getElementById('btnOff').classList.toggle('on', m!=='auto');

    // 风格
    const st=kv.style||'eco';
    document.getElementById('btnEco').classList.toggle('on', st==='eco');
    document.getElementById('btnBalance').classList.toggle('on', st==='balance');
    document.getElementById('btnPerf').classList.toggle('on', st==='perf');

  }catch(e){
    document.getElementById('svc').textContent='读取异常';
    document.getElementById('svc').className='v bad';
  }finally{
    busy=false;
    if(rb){ rb.classList.remove('loading'); rb.textContent='刷新'; }
  }
}

async function setStyle(s){
  // 读现有配置，只改 style 行
  const r=await ksuExec(`cat ${CFG} 2>/dev/null`, 6000);
  let body=(r.stdout||'').replace(/^style=.*$/m, '');
  if(!/mode=/.test(body)) body='mode=auto\nenabled=1\n'+body;
  body=body.replace(/\n{3,}/g,'\n').trim()+'\nstyle='+s+'\n';
  await ksuExec(`printf '${body.replace(/'/g,"'\\''")}' > ${CFG}`, 8000);
  toast('已切换到'+({eco:'省电',balance:'均衡',perf:'流畅'}[s])+'风格');
  setTimeout(refresh,4500);
}

async function setMode(m){
  await ksuExec(`sh ${SCRIPT} mode ${m}`, 12000);
  toast(m==='auto'?'已启用':'已关闭，交还官方');
  setTimeout(refresh,1500);
}

async function act(a){
  const names={restart:'重启服务',release:'归还限制'};
  await ksuExec(`sh ${SCRIPT} ${a}`, 20000);
  toast((names[a]||a)+' 完成');
  setTimeout(refresh,1500);
}

refresh();
setInterval(refresh,5000);
</script>
</body>
</html>
